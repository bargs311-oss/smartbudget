<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="שעון נוכחות">
    <meta name="theme-color" content="#3A3F47">
    <link rel="manifest" href="manifest-work.json">
    <link rel="apple-touch-icon" href="clock-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="clock-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="clock-icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="clock-icon-512.png">
    <link rel="icon" type="image/png" sizes="64x64" href="clock-favicon.png">
    <title>שעון נוכחות ושכר</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sb.css?v=1">
    <script src="cloud.js?v=3"></script>
    <script src="payroll.js?v=3"></script>
    <script src="sb-ui.js?v=1"></script>
    <style>
        .seg-wrap { margin: 12px 16px 0; }
        .tab-content { margin: 16px 16px 0; }
        .clock { overflow: hidden; }
        .clock-time { font-size: 72px; text-align: left; padding: 8px 14px 10px; color: var(--ink-3); }
        .clock.active .clock-time { color: var(--ink); }
        .clock .unit-row button { border: 0; background: none; color: var(--focus); font-weight: 700; font-size: 14px; padding: 4px 0; }
        .clock-actions { padding: 12px 14px 14px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
        .summary { overflow: hidden; margin: 16px 0; }
        .summary .price { font-size: 52px; text-align: left; padding: 6px 14px 8px; }
        .form-list .row { gap: 12px; }
        .form-list .row-main { font-weight: 500; }
        .input-sm { width: 132px; min-height: 40px; padding: 6px 10px; flex: none; }
        input[type="date"].input-sm { width: 150px; }
        .rail-title small::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: var(--rail-ink-2); margin-left: 6px; vertical-align: 1px; }
        .rail-title small.ok::before { background: var(--ok-bg); }
        .rail-title small.busy::before { background: #FFFFFF; }
        .rail-title small.bad::before { background: transparent; box-shadow: inset 0 0 0 1.5px #FFFFFF; }
        .receipt .row { min-height: 44px; }
        .receipt .row.total { font-weight: 700; background: var(--ground); }
        .receipt .minus, .receipt .plus { color: var(--ink); }
        .tab-content > .section-sub { margin-top: 24px; }
    </style>
</head>
<body>

<header class="rail">
    <span aria-hidden="true"></span>
    <div class="rail-title">שעון נוכחות ושכר<small id="cloudSyncStatus" aria-live="polite">בודק ענן...</small></div>
    <button class="rail-btn" onclick="switchTab(2, 'tab-data')" aria-label="הגדרות" data-icon="gear"></button>
</header>

<main class="page">
    <div class="seg-wrap">
        <div class="seg" role="tablist" id="tabsContainer" aria-label="מסכי השעון">
            <button role="tab" aria-selected="true" data-tab="tab-attendance" onclick="switchTab(0, 'tab-attendance', this)">נוכחות</button>
            <button role="tab" aria-selected="false" data-tab="tab-net" onclick="switchTab(1, 'tab-net', this)">מחשבון נטו</button>
            <button role="tab" aria-selected="false" data-tab="tab-data" onclick="switchTab(2, 'tab-data', this)">הגדרות</button>
        </div>
    </div>

    <!-- נוכחות -->
    <section id="tab-attendance" class="tab-content" role="tabpanel">
        <label class="field"><span>חודש</span>
            <select id="monthFilter" class="input" onchange="renderLog()"></select>
        </label>

        <section class="label clock" id="clockLabel" aria-labelledby="clockTitle">
            <div class="label-top">
                <h1 id="clockTitle">לא במשמרת</h1>
                <p class="label-sub" id="clockSub">"דיווח כניסה" מתחיל למדוד את המשמרת</p>
            </div>
            <div class="price clock-time" id="shiftTimer" role="timer">00:00:00</div>
            <div class="unit-row"><span id="clockStartLine">אין משמרת פעילה</span><button id="editStartBtn" onclick="editActiveStartTime()" hidden>עריכת שעת כניסה</button></div>
            <div class="clock-actions">
                <button class="btn" id="btnIn" onclick="clockIn()">דיווח כניסה</button>
                <button class="btn" id="btnOut" onclick="clockOut()" hidden>דיווח יציאה</button>
                <button class="btn btn-text" id="cancelBtn" onclick="cancelActiveShift()" hidden>ביטול דיווח הכניסה</button>
                <button class="btn btn-secondary" onclick="toggleManualBox()">הוספת דיווח ידני, חופשה או מחלה</button>
            </div>
        </section>

        <div id="report"></div>
    </section>

    <!-- מחשבון נטו -->
    <section id="tab-net" class="tab-content" role="tabpanel" hidden>
        <label class="field"><span>חודש עבודה</span>
            <select id="netMonthFilter" class="input" onchange="onNetMonthChange()"></select>
        </label>
        <label class="field"><span>בונוס / תמריץ לחודש הזה (₪)</span>
            <input type="number" id="netBonusInput" class="input" inputmode="decimal" placeholder="0" oninput="renderNetCalculator()">
        </label>
        <div id="netResultBox"></div>
    </section>

    <!-- הגדרות -->
    <section id="tab-data" class="tab-content" role="tabpanel" hidden>
        <h2 class="section-sub" style="margin-top:0;">שכר ויתרות</h2>
        <div class="list form-list">
            <label class="row"><span class="row-main">שכר בסיס לשעה (₪)</span><input class="input input-sm num" type="number" id="settingWage" step="0.1" inputmode="decimal"></label>
            <label class="row"><span class="row-main">דמי נסיעות קבועים (₪)</span><input class="input input-sm num" type="number" id="settingTravel" step="1" inputmode="decimal"></label>
            <label class="row"><span class="row-main">יתרת ימי חופשה</span><input class="input input-sm num" type="number" id="settingVacation" step="0.01" inputmode="decimal"></label>
            <label class="row"><span class="row-main">יתרת ימי מחלה</span><input class="input input-sm num" type="number" id="settingSick" step="0.01" inputmode="decimal"></label>
            <label class="row"><span class="row-main">יתרת דמי הבראה (ימים)</span><input class="input input-sm num" type="number" id="settingHavraa" step="0.01" inputmode="decimal"></label>
            <label class="row"><span class="row-main">תחילת העסקה (לוותק הבראה)</span><input class="input input-sm" type="date" id="settingStartDate"></label>
        </div>
        <p class="sheet-note" style="margin-top:8px;">היתרות מתעדכנות אוטומטית בכל סוף חודש ומסונכרנות בין המכשירים.</p>
        <button class="btn" onclick="saveSettings()">שמירה</button>

        <h2 class="section-sub">דוחות</h2>
        <label class="field"><span>חודש לדוח</span>
            <select id="reportMonthFilter" class="input"></select>
        </label>
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="generatePDF('short')">דוח מקוצר למעסיק</button>
            <button class="btn btn-secondary" onclick="generatePDF('detailed')">דוח מפורט</button>
        </div>

        <h2 class="section-sub">גיבוי וענן</h2>
        <div class="list">
            <button class="row" onclick="exportAllData()"><span class="row-icon" data-icon="inbox"></span><span class="row-main"><span class="row-title">העתקת גיבוי מלא ללוח</span><span class="row-sub">משמרות, בונוסים והגדרות</span></span></button>
            <button class="row" onclick="importAllData()"><span class="row-icon" data-icon="repeat"></span><span class="row-main"><span class="row-title">שחזור מגיבוי</span><span class="row-sub">הדבקת גיבוי שהועתק קודם</span></span></button>
            <button class="row" onclick="changeCloudToken()"><span class="row-icon" data-icon="key"></span><span class="row-main"><span class="row-title">קוד גישה לענן</span><span class="row-sub">אותו קוד כמו באפליקציית התקציב</span></span></button>
        </div>
    </section>
</main>

<!-- סרגל תחתון -->
<nav class="tabbar" aria-label="ניווט ראשי">
    <a class="tab" href="index.html"><span data-icon="budget"></span>תקציב</a>
    <button class="fab" onclick="toggleManualBox()" aria-label="הוספת דיווח ידני" data-icon="plus"></button>
    <a class="tab" href="work.html" aria-current="page" onclick="event.preventDefault(); switchTab(0, 'tab-attendance');"><span data-icon="clock"></span>שעון</a>
</nav>

<!-- גיליון: דיווח ידני / עריכה -->
<div class="sheet" id="manualSheet" role="dialog" aria-modal="true" aria-labelledby="formTitle" aria-hidden="true">
    <div class="sheet-panel">
        <div class="sheet-head"><div><h2 id="formTitle">הוספת דיווח</h2></div><button class="sheet-close" data-close-sheet aria-label="סגירה" onclick="resetEditMode()"></button></div>
        <div class="sheet-body" id="manualEntryBox">
            <p class="form-error" id="manualError" role="alert" hidden></p>
            <label class="field"><span>סוג הדיווח</span>
                <select id="entryType" class="input" onchange="toggleTimeInputs()">
                    <option value="shift">משמרת עבודה רגילה</option>
                    <option value="vacation">יום חופשה (100% תשלום)</option>
                    <option value="sick">יום מחלה (זיהוי אוטומטי)</option>
                </select>
            </label>
            <label class="field"><span>תאריך</span><input type="date" id="manualDate" class="input"></label>
            <div class="btn-row" id="timeInputsContainer">
                <label class="field" style="flex:1;"><span>כניסה</span><input type="time" id="manualStart" class="input"></label>
                <label class="field" style="flex:1;"><span>יציאה</span><input type="time" id="manualEnd" class="input"></label>
            </div>
        </div>
        <div class="sheet-foot">
            <div class="btn-row">
                <button class="btn btn-secondary" id="btnCancelEdit" onclick="resetEditMode()">ביטול</button>
                <button class="btn" id="btnManualSave" onclick="addManualShift()">הוספה לדיווחים</button>
            </div>
        </div>
    </div>
</div>

<script>
    const REGULAR_HOURS = SBPayroll.PAYROLL.REGULAR_HOURS;
    const DEFAULT_EMPLOYMENT_START = '2024-11-24'; // ניתן לשינוי במסך ההגדרות
    const hebrewMonths = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
    let editingId = null;
    let openSwipeId = null;

    const warningSvg = `<svg class="custom-warning-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" title="פחות מ-5 שעות"><path d="M12 2C10.5 2 9.5 3 9.5 4.5V12.5C9.5 14 10.5 15 12 15C13.5 15 14.5 14 14.5 12.5V4.5C14.5 3 13.5 2 12 2ZM12 17.5C10.6 17.5 9.5 18.6 9.5 20C9.5 21.4 10.6 22.5 12 22.5C13.4 22.5 14.5 21.4 14.5 20C14.5 18.6 13.4 17.5 12 17.5Z" fill="#d93025"/></svg>`;

    // ==========================================
    //   נתונים מקומיים
    // ==========================================
    function readShifts() {
        try {
            const arr = JSON.parse(localStorage.getItem('shiftsHistory') || '[]');
            return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
    }
    function writeShifts(shifts) {
        localStorage.setItem('shiftsHistory', JSON.stringify(shifts));
    }

    function pad2(n) { return String(n).padStart(2, '0'); }
    function formatDate(d) { return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`; }
    function formatTime(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    function monthKeyOf(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
    function shiftSortKey(s) {
        const p = SBPayroll.normalizeDate(s.date).split('.');
        return new Date(`${p[2]}-${p[1]}-${p[0]}T${s.start || '00:00'}`).getTime() || 0;
    }

    // משמרת תקינה: מזהה מספרי (מגן מפני הזרקת קוד מנתוני ענן) ותאריך בפורמט אחיד dd.mm.yyyy
    function cleanShift(s) {
        if (!s || s.id === undefined || s.id === null || !isFinite(Number(s.id))) return null;
        return Object.assign({}, s, { id: Number(s.id), date: SBPayroll.normalizeDate(s.date) });
    }

    function sortShifts(shifts) {
        return shifts.sort((a, b) => shiftSortKey(a) - shiftSortKey(b));
    }

    // מאחד תאריכים ישנים בפורמט 1.9.2026 לפורמט 01.09.2026 (חד פעמי)
    function normalizeStoredShifts() {
        const before = localStorage.getItem('shiftsHistory') || '[]';
        const shifts = sortShifts(readShifts().map(cleanShift).filter(Boolean));
        const after = JSON.stringify(shifts);
        if (after !== before) { writeShifts(shifts); return true; }
        return false;
    }

    // ==========================================
    //   הגדרות: כל שינוי מסומן בזמן, כדי שהענן ידע מה העדכני
    // ==========================================
    const SETTING_KEYS = ['hourlyWage', 'travelExp', 'vacationBalance', 'sickBalance', 'havraaBalance', 'employmentStart'];

    function touchSettings() { localStorage.setItem('workSettingsUpdatedAt', String(Date.now())); }
    function setSetting(key, value) { localStorage.setItem(key, String(value)); touchSettings(); }
    function getNum(key, fallback) { const v = parseFloat(localStorage.getItem(key)); return isNaN(v) ? fallback : v; }
    function adjustBalance(key, delta) { setSetting(key, (getNum(key, 0) + delta).toFixed(2)); }

    function readAccruedMonths() {
        try { return JSON.parse(localStorage.getItem('accruedMonths') || '{}') || {}; } catch (e) { return {}; }
    }

    function collectLocalSettings() {
        const settings = {};
        SETTING_KEYS.forEach(k => { settings[k] = localStorage.getItem(k); });
        const bonuses = {};
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('bonus_')) bonuses[k] = localStorage.getItem(k);
        }
        settings.bonuses = bonuses;
        settings.accruedMonths = readAccruedMonths();
        settings.updatedAt = parseInt(localStorage.getItem('workSettingsUpdatedAt') || '0', 10) || 0;
        return settings;
    }

    // מחיל הגדרות מהענן: אם הן חדשות יותר מהמקומיות – מחליף; אחרת משלים רק ערכים חסרים.
    function mergeSettingsFromCloud(cSet) {
        if (!cSet || typeof cSet !== 'object') return false;
        let changed = false;
        const cloudTs = Number(cSet.updatedAt) || 0;
        const localTs = parseInt(localStorage.getItem('workSettingsUpdatedAt') || '0', 10) || 0;
        const cloudIsNewer = cloudTs > localTs;

        SETTING_KEYS.forEach(k => {
            const v = cSet[k];
            if (v === undefined || v === null || v === '') return;
            if (cloudIsNewer || localStorage.getItem(k) === null) {
                if (localStorage.getItem(k) !== String(v)) { localStorage.setItem(k, String(v)); changed = true; }
            }
        });

        if (cSet.bonuses && typeof cSet.bonuses === 'object') {
            if (cloudIsNewer) {
                const localBonusKeys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith('bonus_')) localBonusKeys.push(k);
                }
                localBonusKeys.forEach(k => { if (!(k in cSet.bonuses)) { localStorage.removeItem(k); changed = true; } });
            }
            Object.entries(cSet.bonuses).forEach(([k, v]) => {
                if (!k.startsWith('bonus_')) return;
                if (cloudIsNewer || localStorage.getItem(k) === null) {
                    if (localStorage.getItem(k) !== String(v)) { localStorage.setItem(k, String(v)); changed = true; }
                }
            });
        }

        // חודשים שכבר נצברו – איחוד, כדי שלא תהיה צבירה כפולה בשני מכשירים
        if (cSet.accruedMonths && typeof cSet.accruedMonths === 'object') {
            const local = readAccruedMonths();
            const merged = Object.assign({}, local, cSet.accruedMonths);
            if (JSON.stringify(merged) !== JSON.stringify(local)) {
                localStorage.setItem('accruedMonths', JSON.stringify(merged));
                changed = true;
            }
        }

        if (cloudIsNewer) localStorage.setItem('workSettingsUpdatedAt', String(cloudTs));
        return changed;
    }

    function getEmploymentStart() {
        const v = localStorage.getItem('employmentStart') || DEFAULT_EMPLOYMENT_START;
        const d = new Date(v + 'T00:00');
        return isNaN(d) ? new Date(DEFAULT_EMPLOYMENT_START + 'T00:00') : d;
    }

    // צבירת חופשה/מחלה/הבראה לחודשים שהסתיימו. רץ רק אחרי טעינה מהענן.
    function processMonthlyAccrualsIfNeeded() {
        const shifts = readShifts();
        const accruedMonths = readAccruedMonths();
        const currentMonthKey = monthKeyOf(new Date());
        const startDate = getEmploymentStart();

        const monthsMap = {};
        shifts.forEach(s => {
            if (s.monthKey && (!s.type || s.type === 'shift')) {
                monthsMap[s.monthKey] = (monthsMap[s.monthKey] || 0) + (parseFloat(s.hours) || 0);
            }
        });

        let accrued = false;
        Object.keys(monthsMap).forEach(mKey => {
            if (mKey < currentMonthKey && !accruedMonths[mKey] && mKey >= "2026-09") {
                const fraction = Math.min(monthsMap[mKey] / 182, 1.0); // יחסיות משרה לפי 182 שעות
                const newVac = fraction * (14 / 12);   // חופשה – 14 ימים בשנה
                const newSick = fraction * 1.50;       // מחלה – 1.5 ימים לחודש

                const parts = mKey.split('-');
                const mDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10), 1);
                const diffYears = (mDate - startDate) / (1000 * 60 * 60 * 24 * 365.25);
                let havraaDaysPerYear = 5;
                if (diffYears >= 1) havraaDaysPerYear = 6;
                if (diffYears >= 3) havraaDaysPerYear = 7;
                if (diffYears >= 10) havraaDaysPerYear = 8;
                const newHavraa = fraction * (havraaDaysPerYear / 12);

                adjustBalance('vacationBalance', newVac);
                adjustBalance('sickBalance', newSick);
                adjustBalance('havraaBalance', newHavraa);

                accruedMonths[mKey] = true;
                accrued = true;
            }
        });
        if (accrued) {
            localStorage.setItem('accruedMonths', JSON.stringify(accruedMonths));
            touchSettings();
        }
        return accrued;
    }

    function switchTab(index, tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => { el.hidden = el.id !== tabId; });
        document.querySelectorAll('#tabsContainer [role="tab"]').forEach(el => el.setAttribute('aria-selected', el.dataset.tab === tabId ? 'true' : 'false'));
        window.scrollTo(0, 0);
        if (tabId === 'tab-data') {
            loadSettings();
            populateReportMonthSelector();
        }
        if (tabId === 'tab-net') {
            populateNetMonthSelector();
            renderNetCalculator();
        }
    }

    function loadSettings() {
        document.getElementById('settingWage').value = localStorage.getItem('hourlyWage') || '';
        document.getElementById('settingTravel').value = localStorage.getItem('travelExp') || '0';
        document.getElementById('settingVacation').value = getNum('vacationBalance', 0).toFixed(2);
        document.getElementById('settingSick').value = getNum('sickBalance', 0).toFixed(2);
        document.getElementById('settingHavraa').value = getNum('havraaBalance', 0).toFixed(2);
        document.getElementById('settingStartDate').value = localStorage.getItem('employmentStart') || DEFAULT_EMPLOYMENT_START;
    }

    function saveSettings() {
        const wage = document.getElementById('settingWage').value;
        if (!wage) { SBUI.toast('צריך להזין שכר לשעה'); document.getElementById('settingWage').focus(); return; }
        localStorage.setItem('hourlyWage', wage);
        localStorage.setItem('travelExp', document.getElementById('settingTravel').value || '0');
        localStorage.setItem('vacationBalance', document.getElementById('settingVacation').value || '0');
        localStorage.setItem('sickBalance', document.getElementById('settingSick').value || '0');
        localStorage.setItem('havraaBalance', document.getElementById('settingHavraa').value || '0');
        const start = document.getElementById('settingStartDate').value;
        if (start) localStorage.setItem('employmentStart', start);
        touchSettings();
        syncWorkDataToCloud({ immediate: true });
        SBUI.toast('נשמר ונשלח לענן');
    }

    function calculateShiftPay(startTime, endTime, totalHours, wage) {
        const day = startTime.getDay();
        const hour = startTime.getHours();
        const isWeekend = (day === 6) || (day === 5 && hour >= 14);

        const baseMult = isWeekend ? 1.5 : 1.0;
        const ot1Mult = isWeekend ? 1.75 : 1.25;
        const ot2Mult = isWeekend ? 2.0 : 1.5;

        const regHours = Math.min(totalHours, REGULAR_HOURS);
        const ot1Hours = Math.max(0, Math.min(totalHours - REGULAR_HOURS, 2));
        const ot2Hours = Math.max(0, totalHours - (REGULAR_HOURS + 2));

        const totalPay = (regHours * wage * baseMult) + (ot1Hours * wage * ot1Mult) + (ot2Hours * wage * ot2Mult);
        return { totalPay, regHours, ot1Hours, ot2Hours, isWeekend };
    }

    setInterval(updateTimer, 1000);
    function updateTimer() {
        const startIso = localStorage.getItem('shiftStart');
        const timerDiv = document.getElementById('shiftTimer');
        const label = document.getElementById('clockLabel');
        if (!startIso) {
            label.classList.remove('active');
            timerDiv.textContent = '00:00:00';
            document.getElementById('clockTitle').innerText = 'לא במשמרת';
            document.getElementById('clockSub').innerText = '"דיווח כניסה" מתחיל למדוד את המשמרת';
            document.getElementById('clockStartLine').innerText = 'אין משמרת פעילה';
            document.getElementById('editStartBtn').hidden = true;
            return;
        }
        const startTime = new Date(startIso);
        const diffMs = Math.max(0, new Date() - startTime);
        const hrs = Math.floor(diffMs / 3600000);
        const mins = Math.floor((diffMs % 3600000) / 60000);
        const secs = Math.floor((diffMs % 60000) / 1000);
        label.classList.add('active');
        timerDiv.textContent = `${pad2(hrs)}:${pad2(mins)}:${pad2(secs)}`;
        document.getElementById('clockTitle').innerText = 'במשמרת עכשיו';
        const wage = parseFloat(localStorage.getItem('hourlyWage')) || 0;
        document.getElementById('clockSub').innerText = wage ? `בערך ₪${Math.round(diffMs / 3600000 * wage).toLocaleString('he-IL')} עד עכשיו, לפני תוספות` : 'יציאה מסיימת את המשמרת ושומרת אותה';
        document.getElementById('clockStartLine').innerHTML = `כניסה ב-<b class="num">${formatTime(startTime)}</b>`;
        document.getElementById('editStartBtn').hidden = false;
    }

    async function editActiveStartTime() {
        const startIso = localStorage.getItem('shiftStart');
        if (!startIso) return;
        const startDate = new Date(startIso);
        const atTime = t => { const d = new Date(startDate); const p = t.split(':'); d.setHours(parseInt(p[0], 10), parseInt(p[1], 10), 0, 0); return d; };
        const v = await SBUI.dialog({ title: 'שעת הכניסה', okLabel: 'שמירה', fields: [{
            name: 't', label: 'השעה שבה נכנסת בפועל', type: 'time', value: formatTime(startDate), required: true,
            validate: t => !/^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/.test(t) ? 'השעה לא תקינה' : (atTime(t) > new Date() ? 'שעת הכניסה לא יכולה להיות בעתיד' : null)
        }] });
        if (v && localStorage.getItem('shiftStart')) {
            localStorage.setItem('shiftStart', atTime(v.t).toISOString());
            updateTimer();
        }
    }

    function updateActiveState() {
        const active = !!localStorage.getItem('shiftStart');
        document.getElementById('btnIn').hidden = active;
        document.getElementById('btnOut').hidden = !active;
        document.getElementById('cancelBtn').hidden = !active;
        updateTimer();
    }

    function requireWage() {
        const wage = parseFloat(localStorage.getItem('hourlyWage'));
        if (!wage) {
            SBUI.alert('כדי לחשב שכר צריך להזין שכר לשעה במסך ההגדרות.', 'חסר שכר לשעה').then(() => switchTab(2, 'tab-data'));
            return 0;
        }
        return wage;
    }

    function clockIn() {
        if (!requireWage()) return;
        if (localStorage.getItem('shiftStart')) { SBUI.toast('כבר יש דיווח כניסה פעיל'); return; }
        localStorage.setItem('shiftStart', new Date().toISOString());
        updateActiveState();
    }

    function clockOut() {
        const startIso = localStorage.getItem('shiftStart');
        if (!startIso) { SBUI.toast('אין דיווח כניסה פעיל'); return updateActiveState(); }
        const wage = requireWage();
        if (!wage) return;
        const startTime = new Date(startIso);
        const endTime = new Date();
        const totalHours = (endTime - startTime) / 3600000;

        if (totalHours > 24) {
            SBUI.alert('עברו יותר מ-24 שעות מדיווח הכניסה, לכן הוא בוטל. אפשר להוסיף את המשמרת ידנית בכפתור +.', 'הדיווח בוטל');
            localStorage.removeItem('shiftStart');
            return updateActiveState();
        }

        const payData = calculateShiftPay(startTime, endTime, totalHours, wage);
        saveShiftLog('shift', startTime, endTime, totalHours, payData.totalPay, 0, payData.isWeekend);
        localStorage.removeItem('shiftStart');
        updateActiveState();
    }

    async function cancelActiveShift() {
        if (await SBUI.confirm('דיווח הכניסה הפעיל יימחק והזמן שנמדד לא יישמר.', { title: 'ביטול דיווח הכניסה', okLabel: 'ביטול הדיווח', danger: true })) {
            localStorage.removeItem('shiftStart');
            updateActiveState();
        }
    }

    function editShift(id) {
        closeAllSwipes();
        const shift = readShifts().find(s => Number(s.id) === Number(id));
        if (!shift) return;

        document.getElementById('entryType').value = shift.type || 'shift';
        toggleTimeInputs();

        const mDate = document.getElementById('manualDate');
        const mStart = document.getElementById('manualStart');
        const mEnd = document.getElementById('manualEnd');

        // תאריך תמיד בפורמט dd.mm.yyyy -> yyyy-mm-dd (בעבר 1.9.2026 נשבר כאן)
        const dateParts = SBPayroll.normalizeDate(shift.date).split('.');
        if (dateParts.length === 3) {
            mDate.type = 'date';
            mDate.value = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
        }

        if (!shift.type || shift.type === 'shift') {
            mStart.type = 'time'; mStart.value = shift.start;
            mEnd.type = 'time'; mEnd.value = shift.end;
        }

        editingId = Number(id);
        document.getElementById('formTitle').innerText = "עריכת דיווח";
        document.getElementById('btnManualSave').innerText = "שמירת שינויים";
        SBUI.openSheet('manualSheet');

        editingId = null;
        SBUI.closeSheet('manualSheet');
        document.getElementById('formTitle').innerText = "הוספת דיווח";
        document.getElementById('btnManualSave').innerText = "הוספה לדיווחים";

        document.getElementById('manualStart').value = "";

    function manualError(msg, inputId) {
        SBUI.showFieldError(document.getElementById('manualError'), msg, inputId ? document.getElementById(inputId) : null);
        if (msg && inputId) document.getElementById(inputId).focus();
    }

    function addManualShift() {
        const type = document.getElementById('entryType').value;
        const mDate = document.getElementById('manualDate').value;
        const wage = parseFloat(localStorage.getItem('hourlyWage'));
        manualError('');
        if (!wage) return manualError('צריך להזין שכר לשעה במסך ההגדרות');
        if (!mDate) return manualError('צריך לבחור תאריך', 'manualDate');

        let startTime, endTime, totalHours, totalPay, sickDayNum = 0, isWeekend = false;

        if (type === 'shift') {
            const mStart = document.getElementById('manualStart').value;
            const mEnd = document.getElementById('manualEnd').value;
            if (!mStart || !mEnd) return manualError('צריך למלא שעת כניסה ושעת יציאה', document.getElementById('manualStart').value ? 'manualEnd' : 'manualStart');
            startTime = new Date(`${mDate}T${mStart}`);
            endTime = new Date(`${mDate}T${mEnd}`);
            if (endTime < startTime) endTime.setDate(endTime.getDate() + 1);
            totalHours = (endTime - startTime) / 3600000;
            const payData = calculateShiftPay(startTime, endTime, totalHours, wage);
            totalPay = payData.totalPay;
            isWeekend = payData.isWeekend;
        } else {
            startTime = new Date(`${mDate}T08:00`);
            endTime = new Date(`${mDate}T16:36`);
            totalHours = REGULAR_HOURS;
            totalPay = totalHours * wage;
            if (type === 'vacation') adjustBalance('vacationBalance', -1);
            else if (type === 'sick') { sickDayNum = 1; adjustBalance('sickBalance', -1); }
        }

        if (editingId) {
            let shifts = readShifts();
            const oldS = shifts.find(s => Number(s.id) === editingId);
            // החזרת ימי חופש/מחלה של הדיווח הישן
            if (oldS && oldS.type === 'vacation') adjustBalance('vacationBalance', 1);
            if (oldS && oldS.type === 'sick') adjustBalance('sickBalance', 1);
            shifts = shifts.filter(s => Number(s.id) !== editingId);
            writeShifts(shifts);
            markShiftDeleted(editingId);
        }

        saveShiftLog(type, startTime, endTime, totalHours, totalPay, sickDayNum, isWeekend);
        resetEditMode();
    }

    function saveShiftLog(type, start, end, hours, pay, sickDayNum = 0, isWeekend = false) {
        const shifts = readShifts();
        const newId = Date.now();
        unmarkShiftDeleted(newId);
        shifts.push({
            id: newId, type, sickDayNum,
            date: formatDate(start),
            monthKey: monthKeyOf(start),
            start: formatTime(start),
            end: formatTime(end),
            hours: hours.toFixed(2),
            pay: pay.toFixed(2),
            isWeekend: isWeekend
        });
        writeShifts(sortShifts(shifts));
        syncWorkDataToCloud();
        populateMonthSelector();
        renderLog();
    }

    // לחיצה ראשונה על "מחיקה" הופכת אותו ל"למחוק?", לחיצה שנייה מוחקת
    function deleteShift(id, btn) {
        if (btn && !SBUI.armDelete(btn)) return;
        closeAllSwipes();
        id = Number(id);
        const shifts = readShifts();
        const shiftToDelete = shifts.find(s => Number(s.id) === id);
        if (shiftToDelete && shiftToDelete.type === 'vacation') adjustBalance('vacationBalance', 1);
        if (shiftToDelete && shiftToDelete.type === 'sick') adjustBalance('sickBalance', 1);

        markShiftDeleted(id);
        writeShifts(shifts.filter(s => Number(s.id) !== id));
        syncWorkDataToCloud({ immediate: true });
        populateMonthSelector();
        renderLog();
        const back = shiftToDelete && shiftToDelete.type === 'vacation' ? ' · יום החופשה הוחזר ליתרה'
            : (shiftToDelete && shiftToDelete.type === 'sick' ? ' · יום המחלה הוחזר ליתרה' : '');
        SBUI.toast('הדיווח נמחק' + back);
    }

    function getOptionsHTML(shifts, currentSelected) {
        let html = "";
        const monthsSet = new Set();
        shifts.forEach(s => { if (s.monthKey) monthsSet.add(s.monthKey); });
        monthsSet.add(monthKeyOf(new Date()));

        Array.from(monthsSet).sort().reverse().forEach(mKey => {
            const parts = mKey.split("-");
            const monthName = hebrewMonths[parseInt(parts[1], 10) - 1];
            if (!monthName) return;
            const selectedStr = (mKey === currentSelected) ? "selected" : "";
            html += `<option value="${escHtml(mKey)}" ${selectedStr}>${monthName} ${escHtml(parts[0])}</option>`;
        });
        return html;
    }

    // ==========================================
    //   סנכרון ענן (דרך cloud.js עם קוד גישה)
    // ==========================================
    let syncCloudTimer = null;
    let cloudLoadedOnce = false;
    const pendingSalaries = {};

    function setSyncStatus(text, color) {
        const el = document.getElementById('cloudSyncStatus');
        if (!el) return;
        el.textContent = String(text).replace(/[\u2600-\u27BF\uFE0F]|\uD83D[\uDC00-\uDFFF]|\uD83C[\uDC00-\uDFFF]/g, '').trim();
        el.className = color === '#34c759' ? 'ok' : (color === '#ff3b30' ? 'bad' : (color === '#ff9500' ? 'busy' : ''));
    }

    function getDeletedShiftIds() {
        try { return JSON.parse(localStorage.getItem('deletedShiftIds') || '[]').map(String); }
        catch (e) { return []; }
    }

    function markShiftDeleted(id) {
        if (!id) return;
        const strId = String(id);
        const delIds = getDeletedShiftIds();
        if (!delIds.includes(strId)) {
            delIds.push(strId);
            if (delIds.length > 1000) delIds.splice(0, delIds.length - 1000);
            localStorage.setItem('deletedShiftIds', JSON.stringify(delIds));
        }
    }

    function unmarkShiftDeleted(id) {
        if (!id) return;
        const strId = String(id);
        localStorage.setItem('deletedShiftIds', JSON.stringify(getDeletedShiftIds().filter(d => d !== strId)));
    }

    // מאחד משמרות מקומיות ומהענן (לפי מזהה), בלי משמרות שנמחקו
    function mergeShifts(cloudData) {
        const localDeleted = getDeletedShiftIds();
        const cloudDeleted = (cloudData && Array.isArray(cloudData.deletedShiftIds)) ? cloudData.deletedShiftIds.map(String) : [];
        const allDeletedSet = new Set([...localDeleted, ...cloudDeleted]);
        const allDeletedArr = Array.from(allDeletedSet).slice(-1000);
        localStorage.setItem('deletedShiftIds', JSON.stringify(allDeletedArr));

        const cloudShifts = (cloudData && Array.isArray(cloudData.shiftsHistory)) ? cloudData.shiftsHistory : [];
        const shiftMap = new Map();
        cloudShifts.map(cleanShift).filter(Boolean).forEach(s => { if (!allDeletedSet.has(String(s.id))) shiftMap.set(String(s.id), s); });
        readShifts().map(cleanShift).filter(Boolean).forEach(s => { if (!allDeletedSet.has(String(s.id))) shiftMap.set(String(s.id), s); });
        const merged = sortShifts(Array.from(shiftMap.values()));

        const cloudHasDeleted = cloudShifts.some(s => s && allDeletedSet.has(String(s.id)));
        return { merged, allDeletedArr, cloudHasDeleted, localHasMoreDeletes: localDeleted.some(d => !cloudDeleted.includes(d)) };
    }

    function syncSalaryToCloud(monthKey, net) {
        pendingSalaries[monthKey] = Math.round(net);
        syncWorkDataToCloud();
    }

    function syncWorkDataToCloud(opts) {
        opts = opts || {};
        clearTimeout(syncCloudTimer);
        if (!cloudLoadedOnce) {
            // לא כותבים לענן לפני שהצלחנו לקרוא ממנו (כדי לא לדרוס נתונים)
            setSyncStatus('☁️ נשמר במכשיר', '#8e8e93');
            return;
        }
        setSyncStatus('☁️ מסנכרן...', '#ff9500');

        const doSync = async () => {
            try {
                await SBCloud.updateConfig(cfg => {
                    const cats = cfg.categories || {};
                    const cloudData = cats.__shiftsData || {};
                    const { merged, allDeletedArr } = mergeShifts(cloudData);
                    writeShifts(merged);
                    mergeSettingsFromCloud(cloudData.settings);

                    cats.__shiftsData = {
                        shiftsHistory: merged,
                        deletedShiftIds: allDeletedArr,
                        settings: collectLocalSettings(),
                        updatedAt: Date.now()
                    };
                    const salaries = Object.assign({}, cats.__liveSalaries || {});
                    Object.keys(pendingSalaries).forEach(k => { salaries[k] = pendingSalaries[k]; delete pendingSalaries[k]; });
                    cats.__liveSalaries = salaries;
                    return { aliases: cfg.aliases, categories: cats };
                });
                setSyncStatus('☁️ מסונכרן', '#34c759');
            } catch (e) {
                console.warn('Sync failed', e);
                if (e && e.name === 'AuthError') setSyncStatus('🔒 קוד גישה שגוי', '#ff3b30');
                else setSyncStatus('☁️ לא מקוון', '#8e8e93');
            }
        };

        if (opts.immediate) doSync();
        else syncCloudTimer = setTimeout(doSync, 1200);
    }

    async function loadWorkDataFromCloud(isRetry) {
        if (!SBCloud.hasToken() && !SBCloud.askToken('כדי לסנכרן את המשמרות צריך להזין את קוד הגישה פעם אחת במכשיר הזה.')) {
            setSyncStatus('🔒 אין קוד גישה', '#8e8e93');
            return;
        }
        setSyncStatus('☁️ בודק ענן...', '#ff9500');
        try {
            const cfg = await SBCloud.loadConfig();
            const cats = cfg.categories || {};
            let changed = false;
            let needPush = false;

            if (cats.__shiftsData) {
                const { merged, cloudHasDeleted, localHasMoreDeletes } = mergeShifts(cats.__shiftsData);
                if (JSON.stringify(merged) !== JSON.stringify(readShifts())) {
                    writeShifts(merged);
                    changed = true;
                }
                if (mergeSettingsFromCloud(cats.__shiftsData.settings)) changed = true;
                const cloudCount = Array.isArray(cats.__shiftsData.shiftsHistory) ? cats.__shiftsData.shiftsHistory.length : 0;
                if (cloudHasDeleted || localHasMoreDeletes || merged.length !== cloudCount) needPush = true;
            } else if (readShifts().length > 0) {
                needPush = true;
            }

            cloudLoadedOnce = true;
            if (processMonthlyAccrualsIfNeeded()) { changed = true; needPush = true; }
            if (needPush) syncWorkDataToCloud({ immediate: true });
            else setSyncStatus('☁️ מסונכרן', '#34c759');

            if (changed) {
                populateMonthSelector();
                renderLog();
                loadSettings();
                if (document.getElementById('tab-net').classList.contains('active')) renderNetCalculator();
            }
        } catch (e) {
            console.warn('Load from cloud failed', e);
            if (e && e.name === 'AuthError' && !isRetry && SBCloud.askToken('קוד הגישה לענן שגוי או חסר.')) return loadWorkDataFromCloud(true);
            setSyncStatus(e && e.name === 'AuthError' ? '🔒 קוד גישה שגוי' : '☁️ נשמר מקומית', '#8e8e93');
        }
    }

    function changeCloudToken() {
        if (SBCloud.askToken()) loadWorkDataFromCloud(true);
    }

    async function importAllData() {
        const v = await SBUI.dialog({ title: 'שחזור מגיבוי', okLabel: 'שחזור', danger: true,
            message: 'השחזור מחליף את המשמרות וההגדרות שבמכשיר בנתוני הגיבוי.',
            fields: [{ name: 'raw', label: 'הדבקת נתוני הגיבוי', type: 'textarea', required: true, placeholder: '{"shiftsHistory": ...}' }] });

            if (data.bonuses && typeof data.bonuses === 'object') {
                Object.keys(data.bonuses).forEach(k => { if (k.startsWith('bonus_')) localStorage.setItem(k, String(data.bonuses[k])); });
            }
            if (data.accruedMonths && typeof data.accruedMonths === 'object') localStorage.setItem('accruedMonths', JSON.stringify(data.accruedMonths));
            touchSettings();
            syncWorkDataToCloud({ immediate: true });
            SBUI.toast('הנתונים שוחזרו ויסונכרנו לענן');
            setTimeout(() => location.reload(), 1500);
        } catch (e) {
            SBUI.alert('הטקסט שהודבק אינו גיבוי תקין. כדאי להעתיק שוב את כל הגיבוי ולנסות שוב.', 'השחזור נכשל');
        }
    }

    function renderLog() {
        const shifts = readShifts();
        const reportDiv = document.getElementById('report');
        const selectedMonth = document.getElementById('monthFilter').value;
        const dayNames = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'שבת'];
        let rowsHtml = '';
        let totalPay = 0, totalHours = 0, count = 0;
    
        shifts.slice().reverse().forEach(shift => {
            if (shift.monthKey !== selectedMonth) return;
            count++;
            const id = Number(shift.id);
            const isShort = (parseFloat(shift.hours) <= 5 && (!shift.type || shift.type === 'shift'));
            let badge = '<span class="chip">משמרת</span>';
            if (shift.isWeekend) badge = '<span class="chip chip-ink">שבת/חג</span>';
            if (shift.type === 'vacation') badge = '<span class="chip chip-line">חופשה</span>';
            if (shift.type === 'sick') badge = '<span class="chip chip-line">מחלה</span>';
            const p = SBPayroll.normalizeDate(shift.date).split('.');
            const dObj = p.length === 3 ? new Date(+p[2], +p[1] - 1, +p[0]) : null;
            const dayName = dObj && !isNaN(dObj) ? (dObj.getDay() === 6 ? 'שבת' : 'יום ' + dayNames[dObj.getDay()]) : '';
            const timeString = (shift.type && shift.type !== 'shift') ? 'יום מלא' : `${escHtml(shift.start)}–${escHtml(shift.end)}`;
            rowsHtml += `
                <li class="sw-row" id="shift-container-${id}">
                    <div class="sw-actions">
                        <button class="sw-edit" onclick="editShift(${id})">${SBUI.ICONS.edit}עריכה</button>
                        <button class="sw-del" onclick="deleteShift(${id}, this)">${SBUI.ICONS.trash}מחיקה</button>
                    </div>
                    <div class="sw-content row" tabindex="0" aria-label="${escHtml(shift.date)}, ₪${escHtml(shift.pay)}. החלקה ימינה לעריכה או מחיקה">
                        <span class="row-main">
                            <span class="row-title">${dayName} ${escHtml(shift.date)}</span>
                            <span class="row-sub">${badge} <span class="num">${timeString}</span> · ${escHtml(shift.hours)} ש׳${isShort ? ` <span class="chip chip-ink">${SBUI.ICONS.warn}פחות מ-5 שעות</span>` : ''}</span>
                        </span>
                        <span class="row-amt num">₪${escHtml(shift.pay)}</span>
                    </div>
                </li>`;
            totalPay += parseFloat(shift.pay) || 0;
            if (!shift.type || shift.type === 'shift') totalHours += parseFloat(shift.hours) || 0;
        });
    
        const mParts = (selectedMonth || '').split('-');
        const monthName = mParts.length === 2 ? `${hebrewMonths[parseInt(mParts[1], 10) - 1]} ${mParts[0]}` : '';
        reportDiv.innerHTML = `
            <section class="label summary" aria-label="סיכום החודש">
                <div class="label-top"><h2>שכר מהמשמרות</h2><p class="label-sub">${escHtml(monthName)} · ברוטו, לפני ניכויים. הנטו במסך "מחשבון נטו"</p></div>
                <div class="price"><sup>₪</sup>${Math.round(totalPay).toLocaleString('he-IL')}</div>
                <div class="unit-row"><span>שעות בפועל <b class="num">${totalHours.toFixed(2)}</b></span><span>דיווחים <b>${count}</b></span></div>
            </section>
            <h3 class="section-sub">דיווחים <span>החלקה ימינה לעריכה או מחיקה</span></h3>
            ${count ? `<ul class="list plain">${rowsHtml}</ul>` : '<div class="list"><p class="empty">אין דיווחים לחודש הזה. "דיווח כניסה" או + מוסיפים משמרת.</p></div>'}`;
        SBUI.bindSwipe(reportDiv);
    }

    function renderNetCalculator() {
        const monthKey = document.getElementById('netMonthFilter').value;
        const bonusVal = document.getElementById('netBonusInput').value;
        const bonus = parseFloat(bonusVal || '0') || 0;
        const wage = getNum('hourlyWage', 0);
        const travel = getNum('travelExp', 0);
    
        if (monthKey) {
            const prevBonus = localStorage.getItem('bonus_' + monthKey) || '';
            if ((bonusVal || '') !== prevBonus) {
                if (bonusVal) localStorage.setItem('bonus_' + monthKey, bonusVal);
                else localStorage.removeItem('bonus_' + monthKey);
                touchSettings();
            }
        }
    
        const monthShifts = readShifts().filter(s => s.monthKey === monthKey);
        const r = SBPayroll.computeNet({ shifts: monthShifts, wage, travel, bonus });
    
        if (monthKey) {
            localStorage.setItem('salary_net_' + monthKey, r.net.toFixed(2));
            syncSalaryToCloud(monthKey, r.net);
        }
    
        const box = document.getElementById('netResultBox');
        if (monthShifts.length === 0 && bonus === 0) {
            box.innerHTML = '<div class="list"><p class="empty">אין דיווחים בחודש הזה. אפשר לבחור חודש אחר.</p></div>';
            return;
        }
        if (!wage) {
            box.innerHTML = '<div class="list"><p class="empty">צריך להזין שכר לשעה במסך ההגדרות.</p></div>';
            return;
        }
        const money = n => '₪' + n.toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const deductions = r.pension + r.bleumi + r.tax + r.cibusDeduction;
        const p = (monthKey || '').split('-');
        const payMonth = p.length === 2 ? hebrewMonths[parseInt(p[1], 10) % 12] : '';
        const line = (label, val, cls) => `<div class="row ${cls || ''}"><span class="row-main">${label}</span><span class="row-amt num ${cls === 'minus' ? 'minus' : (cls === 'plus' ? 'plus' : '')}">${cls === 'minus' ? '−' : (cls === 'plus' ? '+' : '')}${money(val)}</span></div>`;
        box.innerHTML = `
            <section class="label summary" aria-label="נטו לתשלום">
                <div class="label-top"><h2>נטו לתשלום</h2><p class="label-sub">משוער · ייכנס במשכורת של ${escHtml(payMonth)}</p></div>
                <div class="price"><sup>₪</sup>${Math.round(r.net).toLocaleString('he-IL')}</div>
                <div class="unit-row"><span>ברוטו למס <b class="num">${money(r.taxGross)}</b></span><span>ניכויים <b class="num">${money(deductions)}</b></span></div>
            </section>
            <h3 class="section-sub">פירוט התלוש</h3>
            <div class="list receipt">
                ${line('שכר משעות עבודה', r.totalGrossPay)}
                ${line('נסיעות קבוע', r.travel)}
                ${line('בונוס / תמריץ', r.bonus)}
                ${line(`זקיפות שכר (סיבוס ${r.daysCount} ימים, רט"ן, בריאות)`, r.totalImputed, 'plus')}
                ${line('ברוטו מחושב למס', r.taxGross, 'total')}
                ${line('פנסיה (7% מהבסיס והבונוס)', r.pension, 'minus')}
                ${line('ביטוח לאומי ובריאות', r.bleumi, 'minus')}
                ${line('מס הכנסה (משוער)', r.tax, 'minus')}
                ${line(`ניכוי סיבוס (${r.daysCount} ימים × ₪${SBPayroll.PAYROLL.CIBUS_DEDUCTION_PER_DAY})`, r.cibusDeduction, 'minus')}
                ${line('נטו לתשלום', r.net, 'total')}
            </div>`;
    }

    function generatePDF(type) {
        const selectedMonthKey = document.getElementById('reportMonthFilter').value;
        const parts = selectedMonthKey.split("-");
        const monthName = hebrewMonths[parseInt(parts[1], 10) - 1];
        const year = escHtml(parts[0]);

        const monthShifts = readShifts().filter(s => s.monthKey === selectedMonthKey);
        if (monthShifts.length === 0) return SBUI.toast('אין דיווחים בחודש שנבחר');

        let totalPay = 0, totalHours = 0, totalDays = 0, totalOt125 = 0, totalOt150 = 0, weekendHours = 0;

        monthShifts.forEach(s => {
            totalPay += parseFloat(s.pay) || 0;
            if (!s.type || s.type === 'shift') {
                const hrs = parseFloat(s.hours) || 0;
                totalHours += hrs;
                totalDays++;
                if (s.isWeekend) {
                    weekendHours += hrs;
                } else {
                    totalOt125 += Math.max(0, Math.min(hrs - REGULAR_HOURS, 2));
                    totalOt150 += Math.max(0, hrs - (REGULAR_HOURS + 2));
                }
            } else { totalDays++; }
        });

        const printWindow = window.open('', '_blank');
        let htmlContent = `
            <!DOCTYPE html>
            <html lang="he" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <title>דוח נוכחות - ${monthName} ${year}</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; direction: rtl; text-align: right; }
                    h2, h3 { color: #007aff; }
                    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
                    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
                    th { background-color: #f2f2f7; }
                    .summary-box { background: #f9f9fb; border: 1px solid #e5e5ea; padding: 12px; border-radius: 8px; }
                </style>
            </head>
            <body>
                <h2>דוח נוכחות - ${type === 'short' ? 'מקוצר' : 'מפורט'} | ${monthName} ${year}</h2>
                <div class="summary-box">
                    <p>ימי עבודה: ${totalDays} | סה"כ שעות בפועל: ${totalHours.toFixed(2)}</p>
                    ${type === 'detailed' ? `<p>שעות 125%: ${totalOt125.toFixed(2)} | שעות 150%: ${totalOt150.toFixed(2)} | שעות שבת/חג: ${weekendHours.toFixed(2)}</p>` : ''}
                    <h3 style="color: #34c759;">שכר משוער (לפני נסיעות ובונוס): ₪${totalPay.toFixed(2)}</h3>
                </div>
        `;

        if (type === 'detailed') {
            htmlContent += `
                <table><thead><tr><th>תאריך</th><th>סוג</th><th>שעות</th><th>סה"כ</th><th>רגילות</th><th>125%</th><th>150%</th><th>שכר יומי</th></tr></thead><tbody>
            `;
            monthShifts.forEach(s => {
                const isShift = (!s.type || s.type === 'shift');
                const typeLbl = s.isWeekend ? "שבת/חג" : (isShift ? "משמרת" : (s.type === 'vacation' ? "חופשה" : "מחלה"));
                const time = isShift ? `${escHtml(s.start)} - ${escHtml(s.end)}` : "יום מלא";
                const hrs = isShift ? (parseFloat(s.hours) || 0) : REGULAR_HOURS;
                let reg = Math.min(hrs, REGULAR_HOURS).toFixed(2);
                let ot125 = isShift && !s.isWeekend ? Math.max(0, Math.min(hrs - REGULAR_HOURS, 2)).toFixed(2) : "0.00";
                let ot150 = isShift && !s.isWeekend ? Math.max(0, hrs - (REGULAR_HOURS + 2)).toFixed(2) : "0.00";

                if (s.isWeekend) { reg = "0.00"; ot125 = "0.00"; ot150 = hrs.toFixed(2); }

                htmlContent += `<tr><td>${escHtml(s.date)}</td><td>${typeLbl}</td><td>${time}</td><td>${escHtml(s.hours)}</td><td>${reg}</td><td>${ot125}</td><td>${ot150}</td><td>₪${escHtml(s.pay)}</td></tr>`;
            });
            htmlContent += `</tbody></table>`;
        }

        htmlContent += `<script>window.onload=function(){window.print();}<\/script></body></html>`;
        printWindow.document.write(htmlContent);
        printWindow.document.close();
    }

    // ג'סטות Swipe
    let touchStartX = 0; let touchCurrentX = 0;
    function handleTouchStart() {}
    function handleTouchMove() {}
    function handleTouchEnd() {}
    function closeAllSwipes() { SBUI.closeAllSwipes(); }

    document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = SBUI.ICONS[el.dataset.icon] || ''; });
    document.querySelectorAll('.sheet-close').forEach(el => { el.innerHTML = SBUI.ICONS.close; });

    window.onload = function() {
        normalizeStoredShifts();
        updateActiveState();
        populateMonthSelector();
        renderLog();
        loadWorkDataFromCloud();
    }
</script>

</body>
</html>
